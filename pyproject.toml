[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardbench"
version = "0.5.0"
description = "Benchmark of guardrails for LLM and LLM agent security"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "Adam Beloucif", email = "adam.beloucif@efrei.net" },
  { name = "Emilien Morice" },
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "fpdf2>=2.8",
  "huggingface_hub>=0.24",
  "requests>=2.31",
]

[project.optional-dependencies]
tools = [
  "torch>=2.4",
  "transformers>=4.44",
  "gliner2[local]>=2.1",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "llm-guard>=0.3.16",
  "nemoguardrails>=0.24",
  "langchain-ollama>=0.3",
]
# Rebuff 0.1.1 pins langchain 0.1 and numpy<2. Install it apart with
# `pip install --no-deps rebuff==0.1.1`: only its heuristic module is used.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
guardbench = "guardbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
