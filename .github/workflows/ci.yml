name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      # Core and dev extras only: no torch, no model download. Adapters are
      # tested with mocks, so CI stays fast and never touches the Hub.
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests scripts
      - name: Tests
        run: pytest
      - name: Version is in sync
        run: python scripts/sync_version.py --check
